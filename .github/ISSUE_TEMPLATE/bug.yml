name: バグ報告
description: 不具合を報告する
title: 'fix: '
labels: [bug]
projects: [mitchi-0719/4]
assignees: [mitchi-0719]
body:
  - type: textarea
    id: actual-behavior
    attributes:
      label: 発生したこと
      description: 実際に起きた問題を記入してください。
    validations:
      required: true
  - type: textarea
    id: reproduction-steps
    attributes:
      label: 再現手順
      description: 問題が起きるまでの操作を記入してください。
      placeholder: |
        1. 操作を開始する
        2. 問題が起きる操作をする
        3. 問題を確認する
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: 期待する結果
      description: 本来どうなるべきかを記入してください。
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 利用環境
      description: 端末・OS・ブラウザ・アプリのバージョンを記入してください。
      placeholder: '例: iPhone 15 / iOS 18 / Safari 18'
    validations:
      required: true
