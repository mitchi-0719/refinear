name: Auto assign pull request

on:
  pull_request_target:
    types: [opened]

permissions:
  pull-requests: write

jobs:
  assign-author:
    if: github.event.pull_request.user.login == 'mitchi-0719'
    runs-on: ubuntu-latest
    steps:
      - name: Assign pull request author
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/assignees" \
            -f "assignees[]=mitchi-0719"
